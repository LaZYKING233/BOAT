<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edge AI CSV Collector</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="page">
    <header class="hero">
      <div>
        <p class="eyebrow">STM32 BOAT</p>
        <h1>Edge AI CSV Collector</h1>
        <p class="subtle">一次开始到停止生成一个独立 raw CSV 文件，用于 NanoEdge AI 数据采集。</p>
      </div>
      <div id="stateBadge" class="badge idle">空闲</div>
    </header>

    <section class="panel">
      <div class="section-title">
        <h2>串口</h2>
        <button id="refreshPorts" type="button" class="secondary">刷新串口</button>
      </div>
      <div class="grid two">
        <label>
          串口
          <select id="portPath"></select>
        </label>
        <label>
          波特率
          <input id="baudRate" type="number" min="1" step="1" value="115200">
        </label>
      </div>
      <p class="hint">如果没有串口，请确认 STM32/LoRa 串口已连接，且没有被 WebUI 或其他串口助手占用。</p>
    </section>

    <section class="panel">
      <div class="section-title">
        <h2>本次 CSV 文件</h2>
      </div>
      <div class="grid two wide-left">
        <label>
          保存目录
          <input id="saveDir" type="text" placeholder="E:\STM32\BOAT\edge_ai_data\raw\temperature\normal">
        </label>
        <label>
          文件名
          <input id="fileName" type="text" placeholder="temperature_normal_001.csv">
        </label>
      </div>
      <label class="check-row">
        <input id="overwrite" type="checkbox">
        覆盖同名文件（默认关闭，防止误删旧数据）
      </label>
      <p class="hint">浏览器本身不能直接弹出系统保存目录给 Node 后端使用，所以这里用文本路径；程序会记住上次目录。</p>
    </section>

    <section class="panel">
      <div class="section-title">
        <h2>本次实验标签</h2>
      </div>
      <div class="grid three">
        <label>
          目标传感器
          <select id="targetSensor">
            <option value="temperature">temperature</option>
            <option value="ph">ph</option>
            <option value="turbidity">turbidity</option>
            <option value="all">all</option>
          </select>
        </label>
        <label>
          手动标签
          <select id="manualLabel">
            <option value="normal">normal</option>
            <option value="abnormal">abnormal</option>
          </select>
        </label>
        <label>
          故障类型
          <input id="faultType" type="text" list="faultTypes" placeholder="none / ph / turbidity / temperature">
          <datalist id="faultTypes">
            <option value="none"></option>
            <option value="ph"></option>
            <option value="turbidity"></option>
            <option value="temperature"></option>
            <option value="imu"></option>
            <option value="gps"></option>
          </datalist>
        </label>
      </div>
      <div class="grid two">
        <label>
          场景标签
          <input id="sceneLabel" type="text" placeholder="temperature_normal_water_idle">
        </label>
        <label>
          备注
          <input id="note" type="text" placeholder="水中静置，温度传感器正常">
        </label>
      </div>
    </section>

    <section class="panel controls">
      <button id="startBtn" type="button" class="primary">开始采集</button>
      <button id="stopBtn" type="button" class="danger" disabled>停止采集</button>
      <span id="message" class="message"></span>
    </section>

    <section class="panel">
      <div class="section-title">
        <h2>采集状态</h2>
      </div>
      <div class="stats">
        <div><span id="rowCount">0</span><small>CSV 行数</small></div>
        <div><span id="rxLineCount">0</span><small>串口行</small></div>
        <div><span id="jsonCount">0</span><small>JSON 数</small></div>
        <div><span id="parseErrorCount">0</span><small>解析失败</small></div>
      </div>
      <dl class="status-list">
        <dt>当前文件</dt><dd id="filePath">-</dd>
        <dt>Session ID</dt><dd id="sessionId">-</dd>
        <dt>最后收到</dt><dd id="lastMessageAt">-</dd>
        <dt>错误</dt><dd id="lastError">-</dd>
      </dl>
    </section>

    <section class="panel">
      <div class="section-title">
        <h2>最新一行预览</h2>
      </div>
      <pre id="preview">暂无数据</pre>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
